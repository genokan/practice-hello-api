---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hello.fullname" . }}
  labels:
    {{- include "hello.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hello.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "hello.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if and .Values.load.enabled .Values.load.ui.enabled }}
      serviceAccountName: {{ include "hello.fullname" . }}-lab
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "hello.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}
      containers:
        - name: hello
          image: {{ include "hello.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: APP_ENV
              value: {{ .Values.environment | quote }}
            - name: LAB_ENABLED
              value: {{ .Values.lab.enabled | quote }}
            - name: LAB_MAX_DURATION_SECONDS
              value: {{ .Values.lab.maxDurationSeconds | quote }}
            - name: LAB_MAX_LATENCY_MILLISECONDS
              value: {{ .Values.lab.maxLatencyMilliseconds | quote }}
            - name: LAB_MAX_CPU_WORKERS
              value: {{ .Values.lab.maxCpuWorkers | quote }}
            - name: LAB_MAX_MEMORY_MIB
              value: {{ .Values.lab.maxMemoryMiB | quote }}
            - name: LAB_LOAD_UI_ENABLED
              value: {{ and .Values.load.enabled .Values.load.ui.enabled | quote }}
            - name: LAB_LOAD_NAME_PREFIX
              value: {{ .Values.load.namePrefix | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- range .Values.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
