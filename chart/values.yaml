replicaCount: 1

image:
  repository: nginxinc/nginx-unprivileged
  tag: 1.27.5-alpine
  digest: ""
  pullPolicy: IfNotPresent

environment: development

lab:
  enabled: false
  maxDurationSeconds: 300
  maxLatencyMilliseconds: 5000
  maxCpuWorkers: 8
  maxMemoryMiB: 512

# Staging-only k6 Job templates. When ui.enabled, /lab can start one of these
# profiles through a namespace-scoped service account; the CronJobs stay suspended.
load:
  enabled: false
  ui:
    enabled: false
  image:
    repository: grafana/k6
    tag: 1.7.1
    pullPolicy: IfNotPresent
  namePrefix: hello-api-load
  targetUrl: http://hello-api-staging-hello-api
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  profiles:
    - name: smoke
      script: smoke.js
    - name: standard
      script: standard.js
    - name: spike
      script: spike.js
    - name: stress
      script: stress.js
    - name: sustained
      script: sustained.js
    - name: soak
      script: soak.js

# Suspended, staging-only Kubernetes failure templates. These are deliberately
# not started by the application: use kubectl create job --from=cronjob/... to
# practise the same commands used during incident response.
failureExercises:
  enabled: false
  imagePull:
    image: "registry.invalid/practice-lab/image-pull-drill:never"
    activeDeadlineSeconds: 600
  crashLoop:
    image: "busybox:1.36"
    activeDeadlineSeconds: 600
    backoffLimit: 100

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: traefik
  annotations: {}
  host: ""

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Soft scheduling preference only: ScheduleAnyway remains runnable on the
# lab's single Kubernetes node while retaining the production topology shape.
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname

podAnnotations: {}

# Add references here when a workload needs Vault-delivered data. Values contain
# only a Kubernetes Secret name and key, never a secret value.
secretEnv: []
# - name: DATABASE_URL
#   secretName: hello-runtime
#   key: database-url
