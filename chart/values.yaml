replicaCount: 1

image:
  repository: nginxinc/nginx-unprivileged
  tag: 1.27.5-alpine
  digest: ""
  pullPolicy: IfNotPresent

environment: development

lab:
  enabled: false
  maxDurationSeconds: 300
  maxLatencyMilliseconds: 5000

# Staging-only, manually started k6 Job templates. Argo renders suspended
# CronJobs; start a one-off run with `kubectl create job --from=cronjob/...`.
load:
  enabled: false
  image:
    repository: grafana/k6
    tag: 1.7.1
    pullPolicy: IfNotPresent
  namePrefix: hello-api-load
  targetUrl: http://hello-api-staging-hello-api
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  profiles:
    - name: smoke
      script: smoke.js
    - name: spike
      script: spike.js
    - name: sustained
      script: sustained.js

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: traefik
  annotations: {}
  host: ""

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 64Mi

podAnnotations: {}

# Add references here when a workload needs Vault-delivered data. Values contain
# only a Kubernetes Secret name and key, never a secret value.
secretEnv: []
# - name: DATABASE_URL
#   secretName: hello-runtime
#   key: database-url
