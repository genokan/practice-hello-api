name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - staging
          - prod
      image_digest:
        description: Optional image digest; blank preserves the selected digest
        required: false
        type: string
      chart_digest:
        description: Optional chart digest; blank preserves the selected digest
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy hello-api
    uses: genokan/practice-lab/.github/workflows/deploy.yaml@main
    with:
      application: hello-api
      environment: ${{ github.event_name == 'release' && 'prod' || inputs.environment }}
      source_environment: ${{ github.event_name == 'release' && 'staging' || inputs.environment }}
      image_digest: ${{ inputs.image_digest }}
      chart_digest: ${{ inputs.chart_digest }}
      source_sha: ${{ github.sha }}
    secrets:
      manifests_token: ${{ secrets.MANIFESTS_TOKEN }}
