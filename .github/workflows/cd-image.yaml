name: CD — Publish image and propose staging

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "config/**"
      - "lib/**"
      - "mix.exs"
      - "mix.lock"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: CD — Publish ARM64 image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          build-args: APP_VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=hello-api-arm64
          cache-to: type=gha,mode=max,scope=hello-api-arm64

  propose-staging:
    name: CD — Auto-merge staging image promotion (${{ needs.image.outputs.digest }})
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: genokan/practice-lab
          token: ${{ secrets.MANIFESTS_TOKEN }}
          path: manifests
          persist-credentials: false
      - name: Select the immutable image
        uses: mikefarah/yq@v4.47.2
        with:
          cmd: >-
            yq -i '.image.digest = "${{ needs.image.outputs.digest }}"'
            manifests/k8s/apps/hello-api/values/staging.yaml
      - name: Open staging image promotion PR
        id: staging-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.MANIFESTS_TOKEN }}
          path: manifests
          branch: automation/hello-api-staging-image
          delete-branch: true
          commit-message: "cd: promote hello-api image ${{ needs.image.outputs.digest }} to staging"
          title: "cd: promote hello-api image ${{ needs.image.outputs.digest }} to staging"
          body: |
            Promotes the immutable image built from ${{ github.sha }} to staging.

            **Image digest:** `${{ needs.image.outputs.digest }}`

            This changes only the staging image selection; chart selection is independent.
      - name: CD — Auto-merge staging image promotion
        if: steps.staging-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.MANIFESTS_TOKEN }}
        run: >-
          gh pr merge "${{ steps.staging-pr.outputs.pull-request-number }}"
          --repo genokan/practice-lab --squash --delete-branch
