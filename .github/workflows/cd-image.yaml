name: CD — Publish image and propose staging

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "config/**"
      - "lib/**"
      - "mix.exs"
      - "mix.lock"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: CD — Publish ARM64 image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          build-args: APP_VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=hello-api-arm64
          cache-to: type=gha,mode=max,scope=hello-api-arm64

  propose-staging:
    name: CD — Propose staging image
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: genokan/practice-lab
          token: ${{ secrets.MANIFESTS_TOKEN }}
          path: manifests
          persist-credentials: false
      - name: Select the immutable image
        uses: mikefarah/yq@v4.47.2
        with:
          cmd: >-
            yq -i '.image.digest = "${{ needs.image.outputs.digest }}"'
            manifests/k8s/apps/hello-api/values/staging.yaml
      - name: Open staging image PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.MANIFESTS_TOKEN }}
          path: manifests
          branch: automation/hello-api-staging-image
          delete-branch: true
          commit-message: "cd: stage hello-api image ${{ needs.image.outputs.digest }}"
          title: "cd: stage hello-api image"
          body: |
            Selects the immutable image built from ${{ github.sha }} for staging.

            This changes only the staging image digest; chart selection is independent.
