name: CI — Validate application

on:
  pull_request:
    paths:
      - ".github/workflows/ci-application.yaml"
      - ".dockerignore"
      - "Dockerfile"
      - "config/**"
      - "lib/**"
      - "mix.exs"
      - "mix.lock"
      - "test/**"
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "config/**"
      - "lib/**"
      - "mix.exs"
      - "mix.lock"
      - "test/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    name: CI — Phoenix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2.4"
          elixir-version: "1.18.4"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp-27.2.4-elixir-1.18.4-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-otp-27.2.4-elixir-1.18.4-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test
