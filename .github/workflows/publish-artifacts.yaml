name: Publish immutable artifacts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-artifacts.yaml"
      - ".dockerignore"
      - "Dockerfile"
      - "config/**"
      - "lib/**"
      - "mix.exs"
      - "mix.lock"
      - "chart/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publish ARM64 image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          build-args: APP_VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=hello-api-arm64
          cache-to: type=gha,mode=max,scope=hello-api-arm64

  chart:
    name: Publish OCI chart
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - run: helm lint chart
      - run: helm template hello-api chart > /tmp/hello-api.yaml
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - id: push
        name: Package and publish
        env:
          CHART_OUTPUT_DIR: ${{ runner.temp }}/charts
          CHART_REGISTRY: oci://ghcr.io/${{ github.repository }}/charts
        run: |
          set -euo pipefail
          mkdir -p "$CHART_OUTPUT_DIR"
          helm package chart --destination "$CHART_OUTPUT_DIR"
          chart_package="$(find "$CHART_OUTPUT_DIR" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$chart_package"
          push_output="$(helm push "$chart_package" "$CHART_REGISTRY")"
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | awk '/^Digest:/ { print $2 }')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
